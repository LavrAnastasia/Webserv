#   curl -i http://127.0.0.1:8080/missing
#   curl -i http://127.0.0.1:8080/archive/
#   curl -i -X DELETE http://127.0.0.1:8080/
#   curl -i -X PUT http://127.0.0.1:8080/ no error_page for 501, so the built-in page is shown

server {
    listen 127.0.0.1:8080;
    root ./public;
    error_page 404 /404.html;
    error_page 403 405 /errors/denied.html;

    location / {
        methods GET;
    }
}
