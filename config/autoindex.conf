#   curl http://127.0.0.1:8080/files/
#   curl http://127.0.0.1:8080/files/nested/
#   curl http://127.0.0.1:8080/files/my%20notes.txt
#   curl -i http://127.0.0.1:8080/archive/

server {
    listen 127.0.0.1:8080;
    root ./public;

    location / {
        methods GET;
    }

    location /files {
        methods GET;
        autoindex on;
    }
}
