#   curl -i http://127.0.0.1:8080/
#   curl -I http://127.0.0.1:8080/
#   curl -I http://127.0.0.1:8080/guide/
#   curl -i -X DELETE http://127.0.0.1:8080/
#   curl -i -X PATCH http://127.0.0.1:8080/
#   curl -i -d x http://127.0.0.1:8080/readonly/

server {
    listen 127.0.0.1:8080;
    root ./public;

    location / {
        methods GET;
    }

    location /guide {
        methods GET HEAD;
        index start.html;
    }

    location /readonly {
        methods GET POST;
    }
}
