# Change the cgi_tester path below to where it lives on this machine

server {
    listen 127.0.0.1:8080;
    root ./YoupiBanane;

    location / {
        methods GET;
        index youpi.bad_extension;
    }

    # No handler consumes the body here, so return 200 answers directly.
    location /post_body {
        methods POST;
        client_max_body_size 100;
        return 200;
    }

    # .bla goes to cgi_tester; it echoes the body back, so the limit covers the 100 MB POSTs
    location /directory {
        methods GET POST;
        index youpi.bad_extension;
        client_max_body_size 200m;
        cgi .bla /home/audobnai/webserv/cgi_tester;
    }
}
