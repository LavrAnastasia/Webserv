server {
    listen 127.0.0.1:8080;
    root ./YoupiBanane;

    location / {
        methods GET;
        index youpi.bad_extension;
    }

    # no handler consumes the body here, so return 200 answers directly.
    location /post_body {
        methods POST;
        client_max_body_size 100;
        return 200;
    }

    location /directory {
        methods GET POST;
        index youpi.bad_extension;
        client_max_body_size 200m; # the tester POSTs 100 MB here
        cgi .bla /tmp/cgi_tester; # change the cgi_tester path
    }
}
