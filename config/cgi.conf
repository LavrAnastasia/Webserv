#   curl -N http://127.0.0.1:8080/cgi-bin/snake.py
#   curl -N "http://127.0.0.1:8080/cgi-bin/snake.py?frames=300"
#   curl "http://127.0.0.1:8080/cgi-bin/cat.sh?name=Anna"
#   curl -d name=Anna http://127.0.0.1:8080/cgi-bin/cat.sh

server {
    listen 127.0.0.1:8080;
    root ./public;

    location / {
        methods GET;
    }

    location /cgi-bin {
        methods GET POST;
        cgi .py /usr/bin/python3;
        cgi .sh /bin/sh;
    }
}
