#   curl http://127.0.0.1:8080/
#   curl http://127.0.0.1:8080/guide/
#   curl -i http://127.0.0.1:8080/guide
#   curl -i http://127.0.0.1:8080/archive/

server {
    listen 127.0.0.1:8080;
    root ./public;

    location / {
        methods GET;
    }

    location /guide {
        methods GET;
        index start.html;
    }
}
