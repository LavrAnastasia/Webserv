#   -H 'Expect:' stops curl from waiting 1 s for a 100 Continue the server never sends
#
#   head -c 500     /dev/zero | curl -i -H 'Expect:' --data-binary @- http://127.0.0.1:8080/
#   head -c 2000    /dev/zero | curl -i -H 'Expect:' --data-binary @- http://127.0.0.1:8080/
#   head -c 2000    /dev/zero | curl -i -H 'Expect:' --data-binary @- http://127.0.0.1:8080/big
#   head -c 2000000 /dev/zero | curl -i -H 'Expect:' --data-binary @- http://127.0.0.1:8080/big
#   head -c 2000000 /dev/zero | curl -i -H 'Expect:' --data-binary @- http://127.0.0.1:8080/unlimited

server {
    listen 127.0.0.1:8080;
    root ./public;
    client_max_body_size 1k; # 1 × 1024 = 1024 bytes

    location / {
        methods POST;
        return 200 accepted;
    }

    location /big {
        methods POST;
        client_max_body_size 1m; # 1 × 1024 × 1024 = 1048576 bytes
        return 200 accepted;
    }

    location /unlimited {
        methods POST;
        client_max_body_size 0; # no limit: the largest size_t value
        return 200 accepted;
    }
}
