#   curl http://127.0.0.1:8080/
#   curl http://localhost:8081/
#   curl http://127.0.0.1:8082/

server {
    listen 127.0.0.1:8080;
    listen localhost:8081;
    root ./public;

    location / {
        methods GET;
    }
}

server {
    listen 0.0.0.0:8082;
    root ./public;

    location / {
        methods GET;
        return 200 second-server;
    }
}
