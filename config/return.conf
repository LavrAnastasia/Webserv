#   curl -i http://127.0.0.1:8080/old
#   curl -L http://127.0.0.1:8080/old curl makes a second request to the Location (/) and prints that page
#   curl -i http://127.0.0.1:8080/away
#   curl -i http://127.0.0.1:8080/gone
#   curl -i http://127.0.0.1:8080/ping
#   curl -i http://127.0.0.1:8080/empty

server {
    listen 127.0.0.1:8080;
    root ./public;
    error_page 404 /404.html;

    location / {
        methods GET;
    }

    location /old {
        methods GET;
        return 301 /;
    }

    location /away {
        methods GET;
        return 302 https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status;
    }

    location /gone {
        methods GET;
        return 404;
    }

    location /ping {
        methods GET;
        return 200 pong;
    }

    location /empty {
        methods GET;
        return 204;
    }
}
