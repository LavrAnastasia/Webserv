#   open http://127.0.0.1:8080/
#
#   curl -i -d hello http://127.0.0.1:8080/uploads/hello.txt
#   curl -i -X DELETE http://127.0.0.1:8080/uploads/hello.txt
#   curl -i -X DELETE http://127.0.0.1:8080/
#   curl -i -X PATCH http://127.0.0.1:8080/
#   curl -I http://127.0.0.1:8080/
#   head -c 2000000 /dev/zero | curl -i --data-binary @- http://127.0.0.1:8080/uploads/big.bin
#   curl -N http://127.0.0.1:8080/cgi-bin/snake.py

server {
    listen 127.0.0.1:8080;
    listen localhost:8081;
    root ./public;
    client_max_body_size 1m; # 1 × 1024 × 1024 = 1048576 bytes
    error_page 404 /404.html;
    error_page 403 405 /errors/denied.html;

    location / {
        methods GET HEAD;
        index demo.html;
    }

    location /docs {
        methods GET;
        root ./public/archive;
    }

    location /guide {
        methods GET HEAD;
        index start.html;
    }

    location /files {
        methods GET;
        autoindex on;
    }

    location /uploads {
        methods GET POST DELETE;
        upload_path uploads;
        autoindex on;
    }

    location /cgi-bin {
        methods GET POST;
        cgi .py /usr/bin/python3;
        cgi .sh /bin/sh;
    }

    location /old {
        methods GET;
        return 301 /;
    }

    location /mdn {
        methods GET;
        return 302 https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status;
    }

    location /ping {
        methods GET;
        return 200 pong;
    }
}

server {
    listen 0.0.0.0:8082;
    root ./public;

    location / {
        methods GET;
        return 200 second-server;
    }
}
