#   curl -i -d hello http://127.0.0.1:8080/uploads/hello.txt
#   curl http://127.0.0.1:8080/uploads/hello.txt
#   curl http://127.0.0.1:8080/uploads/
#   curl -i -d again http://127.0.0.1:8080/uploads/hello.txt the file already exists
#   curl -i -d hello http://127.0.0.1:8080/uploads/ no file name
#   curl -i -X DELETE http://127.0.0.1:8080/uploads/hello.txt
#   curl -i -X DELETE http://127.0.0.1:8080/uploads/hello.txt

server {
    listen 127.0.0.1:8080;
    root ./public;

    location / {
        methods GET;
    }

    location /uploads {
        methods GET POST DELETE;
        upload_path uploads;
        autoindex on;
    }
}
