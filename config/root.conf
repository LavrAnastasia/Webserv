#   curl http://127.0.0.1:8080/
#   curl http://127.0.0.1:8080/docs/page.html
#   curl http://127.0.0.1:8080/archive/docs/page.html
#   curl http://127.0.0.1:8080/page.html

server {
    listen 127.0.0.1:8080;
    root ./public;

    location / {
        methods GET;
    }

    location /docs {
        methods GET;
        root ./public/archive;
    }
}
